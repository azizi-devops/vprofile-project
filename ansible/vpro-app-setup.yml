- name: Setup Tomcat10 & Deploy Artifact
  hosts: appsrvgrp
  become: yes
  
  vars:
    timestamp: "{{ansible_date_time.date}}_{{ansible_date_time.hour}}_{{ansible_date_time.minute}}"
  
  tasks:

    - name: Install JDK on Ubuntu 
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: yes
      when: ansible_distribution == 'Ubuntu' 

    - name: Install tomcat 10 on Ubuntu
      apt:
        name: 
          - tomcat10
          - tomcat10-admin
          - tomcat10-docs
          - tomcat10-common
        state: present
        update_cache: yes
      tags:
       - install

    - name: Download latest VProfile.war from nexus
      get_url:
        url: "http://{{USER}}:{{PASS}}@{{nexusip}}:8081/repository/{{reponame}}/{{groupid}}/{{artifactid}}/{{build}}-{{time}}/{{vprofile_version}}"
        dest: "/tmp/vprofile-{{vprofile_version}}"
      register: wardeploy
      tags:
       - deploy

    - stat:
        path: /var/lib/tomcat10/webapps/ROOT
      register: artifact_stat
      tags:
       - deploy

    - name: Stop tomcat svc
      command: systemctl stop tomcat10.service
    
    - name: Try Backup and Deploy

      block:
      - name: Archive ROOT dir with timestamp
        archive:
          path: /var/lib/tomcat10/webapps/ROOT
          dest: "/opt/ROOT_{{timestamp}}.tgz"
        when: artifact_stat.stat.exists
        register: archive_info
        tags:
         - deploy

      - name: copy ROOT dir with old_ROOT name
        shell: cp -r ROOT old_ROOT
        args:
          chdir: /var/lib/tomcat10/webapps/

      - name: Delete current artifact
        file:
          path: "{{item}}"
          state: absent
        when: archive_info.changed
        loop:
         - /var/lib/tomcat10/webapps/ROOT
         - /var/lib/tomcat10/webapps/ROOT.war
        tags:
         - deploy

      - name: Try deploy artifact else restore from previos old_ROOT
        block:
         - name: Deploy vprofile artifact
           copy:
             src: "/tmp/vprofile-{{vprofile_version}}"
             dest: /var/lib/tomcat10/webapps/ROOT.war
             remote_src: yes
           register: deploy_info
           tags:
            - deploy
        rescue:
          - shell: cp -r old_ROOT ROOT
            args:
              chdir: /var/lib/tomcat10/webapps/

      rescue:
       - name: Start tomcat svc
         command: systemctl start tomcat10.service

      
    - name: Reload systemd daemon
      command: systemctl daemon-reload
      when: deploy_info.changed


    - name: Start tomcat svc
      command: systemctl start tomcat10.service
      when: deploy_info.changed
      tags:
       - deploy

    - name: Wait until ROOT.war is extracted to ROOT directory
      wait_for:
        path: /var/lib/tomcat10/webapps/ROOT
      tags:
       - deploy

